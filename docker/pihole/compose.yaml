
name: pi-hole

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  pihole:
    <<: *service-defaults
    container_name: pihole
    image: pihole/pihole:latest
    network_mode: host
    environment:
      TZ: ${TZ:-Asia/Colombo}
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD:?required}
      FTLCONF_dns_listeningMode: LOCAL
    volumes:
      - type: bind
        source: /mnt/old-hdd/docker/pihole/etc-pihole
        target: /etc/pihole
        bind:
          create_host_path: false
