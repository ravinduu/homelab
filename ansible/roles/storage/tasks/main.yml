- name: Create mount point directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0755"
  loop: "{{ storage_mounts }}"
  become: true

- name: Mount disks and persist them in fstab
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "UUID={{ item.uuid }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.opts }}"
    passno: 2
    state: mounted
  loop: "{{ storage_mounts }}"
  become: true