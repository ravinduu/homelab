- name: Resolve and validate Grafana initialization credentials
  ansible.builtin.import_tasks: credentials.yml

- name: Check monitoring volumes and host prerequisites
  ansible.builtin.import_tasks: preflight.yml

- name: Deploy monitoring stack
  ansible.builtin.include_role:
    name: compose_stack
    apply:
      tags: [monitoring]
  vars:
    stack_dir: "{{ monitoring_stack_dir }}"
    stack_compose_src: "{{ monitoring_compose_src }}"
    stack_env_template: "{{ playbook_dir }}/roles/monitoring/templates/env.j2"
    stack_directories:
      - path: "{{ monitoring_stack_dir }}/prometheus"
      - path: "{{ monitoring_stack_dir }}/grafana"
      - path: "{{ monitoring_stack_dir }}/grafana/provisioning"
      - path: "{{ monitoring_stack_dir }}/grafana/provisioning/datasources"
    stack_config_files:
      - src: "{{ monitoring_config_src }}/prometheus/prometheus.yml"
        dest: prometheus/prometheus.yml
      - src: "{{ monitoring_config_src }}/grafana/provisioning/datasources/prometheus.yml"
        dest: grafana/provisioning/datasources/prometheus.yml
    stack_health_urls:
      - "http://{{ monitoring_web_bind_ip }}:9090/-/ready"
      - "http://{{ monitoring_web_bind_ip }}:3000/api/health"
