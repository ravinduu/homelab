- name: Inspect existing Grafana initialization credentials when Vault password is missing
  community.docker.docker_container_info:
    name: grafana
  register: monitoring_grafana_container
  become: true
  no_log: true
  when: vault_grafana_admin_password | default('', true) == ''

- name: Resolve Grafana initialization password
  ansible.builtin.set_fact:
    monitoring_grafana_admin_password: >-
      {{ vault_grafana_admin_password | default(
         existing_env | select('match', '^GF_SECURITY_ADMIN_PASSWORD=') |
         map('regex_replace', '^GF_SECURITY_ADMIN_PASSWORD=', '') |
         first | default(''), true) }}
  vars:
    existing_env: >-
      {{ (monitoring_grafana_container.container | default({}, true)).get('Config', {}).get('Env', []) }}
  no_log: true

- name: Check Grafana initialization credentials
  ansible.builtin.set_fact:
    monitoring_grafana_credentials_valid: >-
      {{ monitoring_grafana_admin_user | default(none) is string
         and monitoring_grafana_admin_password is string
         and monitoring_grafana_admin_user | trim | length > 0
         and monitoring_grafana_admin_password | trim | length > 0
         and monitoring_grafana_admin_user.splitlines() == [monitoring_grafana_admin_user]
         and monitoring_grafana_admin_password.splitlines() == [monitoring_grafana_admin_password] }}
  no_log: true

- name: Validate Grafana credentials
  ansible.builtin.assert:
    that:
      - monitoring_grafana_credentials_valid
    fail_msg: >-
      Set a nonempty, single-line monitoring_grafana_admin_user and
      vault_grafana_admin_password in Ansible Vault, or provide the password
      through the existing grafana container's GF_SECURITY_ADMIN_PASSWORD.
      These credentials initialize new databases; they do not reset existing logins.

