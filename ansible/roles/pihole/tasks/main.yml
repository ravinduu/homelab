- name: Deploy Pi-hole stack
  ansible.builtin.include_role:
    name: compose_stack
    apply:
      tags: [pihole]
  vars:
    stack_dir: "{{ pihole_stack_dir }}"
    stack_compose_src: "{{ pihole_compose_src }}"
    stack_env_template: "{{ playbook_dir }}/roles/pihole/templates/env.j2"
    stack_directories:
      - path: "{{ pihole_data_dir }}"
    stack_wait: false
    stack_web_ports: [53]
    stack_port_timeout: 60

- name: Verify Pi-hole answers DNS queries
  ansible.builtin.command: >-
    dig +short +time=3 +tries=2 @{{ ansible_host }} {{ pihole_test_domain }}
  delegate_to: localhost
  register: pihole_dig
  changed_when: false
  failed_when: pihole_dig.stdout | trim == ''
  when: not ansible_check_mode
