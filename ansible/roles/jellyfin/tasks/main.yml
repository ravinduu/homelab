- name: Check Jellyfin media and GPU prerequisites
  ansible.builtin.import_tasks: preflight.yml

- name: Deploy Jellyfin stack
  ansible.builtin.include_role:
    name: compose_stack
    apply:
      tags: [jellyfin]
  vars:
    stack_dir: "{{ jellyfin_stack_dir }}"
    stack_compose_src: "{{ jellyfin_compose_src }}"
    stack_env_template: "{{ playbook_dir }}/roles/jellyfin/templates/env.j2"
    stack_directories:
      - path: "{{ jellyfin_data_dir }}"
      - path: "{{ jellyfin_data_dir }}/config"
      - path: "{{ jellyfin_data_dir }}/cache"
    stack_repair_containers: [jellyfin]
    stack_health_urls:
      - "http://{{ jellyfin_web_bind_ip }}:8096/health"
