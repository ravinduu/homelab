- name: Check the media directory exists
  ansible.builtin.stat:
    path: "{{ jellyfin_media_dir }}"
  register: jellyfin_media

- name: Refuse to continue without the media directory
  ansible.builtin.assert:
    that: jellyfin_media.stat.exists and jellyfin_media.stat.isdir
    fail_msg: >-
      {{ jellyfin_media_dir }} does not exist. Is the media disk mounted
      (storage role), and does it contain this folder?
  when: not ansible_check_mode

- name: Check the GPU render device exists
  ansible.builtin.stat:
    path: "{{ jellyfin_render_device }}"
  register: jellyfin_gpu

- name: Refuse to continue without the GPU device
  ansible.builtin.assert:
    that: jellyfin_gpu.stat.exists
    fail_msg: "{{ jellyfin_render_device }} not found. Is the Intel GPU driver loaded?"
  when: not ansible_check_mode

- name: Look up the render group
  ansible.builtin.getent:
    database: group
    key: render
  register: jellyfin_render_group

- name: Remember the render GID
  ansible.builtin.set_fact:
    jellyfin_render_gid: "{{ jellyfin_render_group.ansible_facts.getent_group['render'][1] }}"

