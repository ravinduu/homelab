- name: Resolve and validate Arr API keys
  ansible.builtin.import_tasks: credentials.yml

- name: Verify the media filesystem is mounted
  ansible.builtin.command:
    argv: [mountpoint, --quiet, /mnt/media]
  changed_when: false
  check_mode: false

- name: Deploy Arr stack
  ansible.builtin.include_role:
    name: compose_stack
    apply:
      tags: [arr]
  vars:
    stack_dir: "{{ arr_stack_dir }}"
    stack_compose_src: "{{ arr_compose_src }}"
    stack_env_template: "{{ playbook_dir }}/roles/arr/templates/env.j2"
    stack_directories:
      - {path: /var/lib/homelab/arr/qbittorrent, owner: "{{ arr_puid }}", group: "{{ arr_pgid }}"}
      - {path: /var/lib/homelab/arr/prowlarr, owner: "{{ arr_puid }}", group: "{{ arr_pgid }}"}
      - {path: /var/lib/homelab/arr/radarr, owner: "{{ arr_puid }}", group: "{{ arr_pgid }}"}
      - {path: /var/lib/homelab/arr/sonarr, owner: "{{ arr_puid }}", group: "{{ arr_pgid }}"}
      - {path: /var/lib/homelab/arr/unpackerr, owner: "{{ arr_puid }}", group: "{{ arr_pgid }}"}
    stack_web_host: "{{ arr_web_bind_ip }}"
    stack_web_ports: [8080, 9696, 7878, 8989]
