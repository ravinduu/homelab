- name: Read existing Arr API keys when Vault values are missing
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sys
        import xml.etree.ElementTree as ET
        print(ET.parse(sys.argv[1]).getroot().findtext('ApiKey', default=''), end='')
      - "/var/lib/homelab/arr/{{ item.app }}/config.xml"
  loop:
    - app: radarr
      vault_key: "{{ vault_arr_radarr_api_key | default('') }}"
    - app: sonarr
      vault_key: "{{ vault_arr_sonarr_api_key | default('') }}"
  when: item.vault_key is none or item.vault_key == ''
  register: arr_existing_api_keys
  become: true
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Resolve Arr API keys
  ansible.builtin.set_fact:
    arr_radarr_api_key: >-
      {{ vault_arr_radarr_api_key | default(
        arr_existing_api_keys.results[0].stdout | default('')
        if arr_existing_api_keys.results[0].rc | default(1) == 0 else '', true) }}
    arr_sonarr_api_key: >-
      {{ vault_arr_sonarr_api_key | default(
        arr_existing_api_keys.results[1].stdout | default('')
        if arr_existing_api_keys.results[1].rc | default(1) == 0 else '', true) }}
  no_log: true

- name: Check Arr API key validity
  ansible.builtin.set_fact:
    arr_api_keys_valid: >-
      {{ arr_radarr_api_key is string and arr_sonarr_api_key is string
         and arr_radarr_api_key | trim | length > 0
         and arr_sonarr_api_key | trim | length > 0
         and arr_radarr_api_key.splitlines() == [arr_radarr_api_key]
         and arr_sonarr_api_key.splitlines() == [arr_sonarr_api_key] }}
  no_log: true

- name: Validate Arr secrets
  ansible.builtin.assert:
    that:
      - arr_api_keys_valid
    fail_msg: >-
      Arr API keys are missing or invalid. Set vault_arr_radarr_api_key and
      vault_arr_sonarr_api_key in group_vars/homelab/vault.yml, or ensure the
      existing /var/lib/homelab/arr/{radarr,sonarr}/config.xml files contain
      nonempty, single-line ApiKey values readable with become privileges.

