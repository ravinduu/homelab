# Local proposal for the cAdvisor service only; not a complete stack file.
# Merge the service changes into monitoring/docker-compose.yaml after approval.
services:
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    cap_add:
      - SYSLOG
    devices:
      - /dev/kmsg:/dev/kmsg:r
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    networks:
      - monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  monitoring:
    name: monitoring-network
    driver: bridge
