services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
      - "7359:7359/udp"
    volumes:
      - /var/lib/homelab/jellyfin/config:/config
      - /var/lib/homelab/jellyfin/cache:/cache
      - /mnt/media/jellyfin-media:/media:ro
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "992"
    restart: unless-stopped
