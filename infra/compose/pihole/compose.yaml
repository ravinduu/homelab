services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    network_mode: host
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      TZ: Asia/Colombo
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD:?required in protected pihole runtime env}
      FTLCONF_dns_listeningMode: ALL
    volumes:
      - /mnt/old-hdd/docker/pihole/etc-pihole:/etc/pihole
    restart: unless-stopped
